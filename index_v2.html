<style>
:root{--bg:#05070c;--bg2:rgba(255,255,255,.05);--bg3:rgba(255,255,255,.08);--border:rgba(255,255,255,.09);--b2:rgba(255,255,255,.16);--text:#f3f5f9;--dim:#9aa4b8;--muted:#5f6878;--orange:#FF7A45;--orange2:#FFB454;--teal:#3CE8D6;--teal2:#22B8C4;--violet:#B388FF;--violet2:#7C5CFC;--amber:#FBBF24;--green:#34D399;--red:#FB7185;--r:16px;--shadow:0 10px 28px -10px rgba(0,0,0,.55);}

.logo-sub{font-size:9px;color:var(--muted);letter-spacing:3px;}
.tpill{background:linear-gradient(135deg,rgba(255,122,69,.2),rgba(255,180,84,.08));border:1px solid var(--orange);border-radius:20px;padding:5px 12px;display:flex;align-items:center;gap:5px;transition:opacity .3s;}
.tpill.off{opacity:0;pointer-events:none;}
.tn{color:var(--orange2);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(7,9,15,.68);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--border);display:flex;z-index:10;}
.nb{flex:1;padding:9px 0 7px;background:none;border:none;color:var(--muted);font-size:8px;letter-spacing:1px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .15s;}

.pg{flex:1;overflow-y:auto;padding:13px 13px 16px;}
.day-row{display:flex;gap:6px;margin-bottom:12px;}

.db.on{color:#0a0a0a;border-color:transparent;box-shadow:var(--shadow);}
.tdot{position:absolute;top:4px;right:4px;width:5px;height:5px;background:var(--orange2);border-radius:50%;}

.card{background:var(--bg2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:10px;box-shadow:var(--shadow);transition:opacity .2s;}

.cinp{width:100%;background:var(--bg3);border:1px solid var(--b2);border-radius:6px;padding:7px 8px;color:var(--text);font-family:inherit;font-size:14px;outline:none;text-align:center;-moz-appearance:textfield;}

.crec{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--border);font-size:11px;}

.hcard{background:var(--bg2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:10px;box-shadow:var(--shadow);}
.hhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.hdbadge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;color:#0a0a0a;}
.hdate{font-size:10px;color:#444;}
.hex{display:flex;justify-content:space-between;padding-top:5px;margin-top:5px;border-top:1px solid var(--border);}
.hexn{font-size:11px;color:#aaa;}
.hexd{font-size:11px;color:var(--muted);}
.ttoggle{display:flex;gap:6px;margin-bottom:14px;}
.ttbtn{flex:1;padding:9px;background:var(--bg2);border:1px solid var(--b2);border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;}
.ttbtn.on{color:#fff;border-color:#fff;}
.tsel{display:flex;gap:7px;margin-bottom:12px;}
.tsel select{background:var(--bg3);border:1px solid var(--b2);border-radius:8px;padding:8px 10px;color:var(--text);font-family:inherit;font-size:11px;outline:none;flex:1;}
.cbox{background:var(--bg2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
.ctitle{font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:10px;}
.prbadge{display:inline-block;background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.3);border-radius:6px;font-size:10px;padding:2px 8px;margin-top:8px;}
.nodata{color:var(--muted);font-size:12px;text-align:center;padding:28px 0;}
.cardio-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.cstat{background:var(--bg2);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;}

.phdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.pname{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;}
.pwks{font-size:10px;color:var(--muted);}
.recwks{display:inline-block;background:rgba(60,232,214,.1);color:var(--teal);border:1px solid rgba(60,232,214,.3);border-radius:6px;font-size:10px;padding:2px 8px;margin-top:4px;}
.pdblock{background:var(--bg2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:10px;box-shadow:var(--shadow);}
.pdtitle{font-size:11px;font-weight:700;margin-bottom:10px;}
.pexrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--border);}
.pexinfo{flex:1;min-width:0;}
.pexnm{font-size:12px;}
.pexmeta{font-size:10px;color:var(--muted);}
.ordbtns{display:flex;flex-direction:column;gap:2px;}
.ordbtn{background:var(--bg3);border:1px solid var(--b2);border-radius:5px;width:20px;height:16px;font-size:9px;line-height:1;color:var(--dim);cursor:pointer;padding:0;font-family:inherit;}
.ibtn{background:var(--bg3);border:1px solid var(--b2);border-radius:7px;padding:4px 9px;color:var(--dim);font-size:11px;cursor:pointer;font-family:inherit;}
.addbtn{width:100%;padding:8px;background:none;border:1px dashed var(--b2);border-radius:8px;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;margin-top:8px;letter-spacing:1px;}
.airbtn{width:100%;padding:13px;background:linear-gradient(135deg,rgba(124,92,252,.16),rgba(179,136,255,.06));border:1px solid var(--violet);border-radius:var(--r);color:var(--violet);font-family:inherit;font-size:12px;cursor:pointer;letter-spacing:1px;margin-bottom:14px;}
.tplbtn{width:100%;padding:13px;background:linear-gradient(135deg,rgba(60,232,214,.16),rgba(78,205,196,.06));border:1px solid var(--teal);border-radius:var(--r);color:var(--teal);font-family:inherit;font-size:12px;cursor:pointer;letter-spacing:1px;margin-bottom:14px;}
.tpl-lvl{font-size:11px;color:var(--muted);letter-spacing:1px;margin:14px 0 6px;}
.tpl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg3);border:1px solid var(--b2);border-radius:10px;padding:9px 11px;margin-bottom:7px;}
.tpl-info{min-width:0;}
.tpl-name{font-size:12.5px;font-weight:600;color:var(--text);}
.tpl-desc{font-size:10px;color:var(--muted);margin-top:2px;}
.installbtn{background:linear-gradient(135deg,rgba(255,122,69,.22),rgba(255,180,84,.1));border:1px solid var(--orange);border-radius:20px;padding:6px 12px;color:var(--orange);font-family:inherit;font-size:11px;cursor:pointer;}
.hidden{display:none!important;}
.dba-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.dba-btn{background:var(--bg3);border:1px solid var(--b2);border-radius:7px;padding:5px 9px;color:var(--dim);font-size:10px;cursor:pointer;font-family:inherit;}
.gcard{background:var(--bg2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:var(--shadow);}
.gtitle{font-size:9px;color:var(--muted);letter-spacing:2px;margin-bottom:10px;}
.gbig{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:2px;}
.gsub{font-size:10px;color:var(--muted);margin-top:2px;}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px;}
.wcell{border-radius:10px;padding:9px 5px;text-align:center;border:1px solid var(--border);background:var(--bg3);}
.wcell .wn{font-size:9px;color:var(--muted);margin-bottom:3px;}
.wcell .wd{font-size:12px;font-weight:700;}
.wcell.done{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.35);}
.wcell.cur{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange);}
.wcell.fut{opacity:.35;}
.ginprow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.ginplabel{font-size:11px;color:var(--muted);flex:1;}
.ginp{background:var(--bg3);border:1px solid var(--b2);border-radius:6px;padding:7px 10px;color:var(--text);font-family:inherit;font-size:14px;outline:none;width:110px;}
.g2grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.mov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:20;display:flex;align-items:flex-end;justify-content:center;}
.mov.hidden{display:none;}
.mbox{background:rgba(16,18,26,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);box-shadow:0 -10px 40px rgba(0,0,0,.5);border-radius:22px 22px 0 0;padding:18px 14px 36px;width:100%;max-width:480px;max-height:90dvh;overflow-y:auto;}
.mtitle{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;margin-bottom:12px;}
.mfield{margin-bottom:10px;}
.mlabel{font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:4px;}
.minp{width:100%;background:var(--bg3);border:1px solid var(--b2);border-radius:8px;padding:9px 12px;color:var(--text);font-family:inherit;font-size:13px;outline:none;}
.minp.ta{resize:vertical;min-height:80px;}
.mrow{display:flex;gap:7px;}
.mrow .mfield{flex:1;}
.mbtn{width:100%;padding:12px;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px;letter-spacing:1px;}
.mbtn.pri{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#1a0d04;box-shadow:0 8px 20px -6px rgba(255,122,69,.4);}

.airesp{background:var(--bg3);border:1px solid var(--b2);border-radius:8px;padding:12px;font-size:11px;color:var(--text);line-height:1.7;white-space:pre-wrap;margin-top:10px;max-height:240px;overflow-y:auto;}
.cbrow{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.cbrow input{width:16px;height:16px;cursor:pointer;accent-color:var(--orange);}
.cbrow label{font-size:12px;color:var(--dim);cursor:pointer;}
.mtab-row{display:flex;gap:6px;margin-bottom:12px;}
.mtab-btn{flex:1;padding:8px;background:var(--bg3);border:1px solid var(--b2);border-radius:8px;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s;}
.mtab-btn.on{background:linear-gradient(135deg,var(--orange),var(--orange2));border-color:transparent;color:#1a0d04;font-weight:700;}

.excat-btn{padding:5px 10px;background:var(--bg3);border:1px solid var(--b2);border-radius:6px;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s;}
.excat-btn.on{background:var(--b2);color:#fff;border-color:#555;}

.ex-item:active{border-color:var(--orange);color:var(--orange);}

<script>
const YT="https://www.youtube.com/results?search_query=";
const DAY_CAT={"월":"가슴","화":"하체","수":"등","목":"하체","금":"어깨"};
const EX_DB={

function recWeeks(prog){
  const d=Object.keys(prog.days).length;
  if(d<=3)return{note:"3일 분할 · 초급 6-8주 / 중급 8-12주 권장"};
  if(d===4)return{note:"4일 분할 · 초급 8-12주 / 중급 12-16주 권장"};
  return{note:"5일+ 고빈도 · 12-16주 권장"};
}

const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

function startTimer(sec){
  if(S._ti)clearInterval(S._ti);
  S.tsec=sec;S.tmax=sec;
  S._ti=setInterval(()=>{S.tsec--;if(S.tsec<=0){clearInterval(S._ti);S._ti=null;}updTimer();},1000);
  updTimer();
}
function updTimer(){
  const p=document.getElementById("tp"),n=document.getElementById("tn");
  if(!p||!n)return;
  S.tsec>0?(p.classList.remove("off"),n.textContent=S.tsec+"s"):p.classList.add("off");
}

function toggleSet(exId,i){
  const k=S.day+"_"+exId+"_"+i;S.logs[k]=!S.logs[k];
  const ex=S.prog.days[S.day]&&S.prog.days[S.day].exercises.find(function(e){return e.id===exId;});
  if(S.logs[k]&&ex)startTimer(ex.rest);render();
}
function isDone(exId,i){return!!S.logs[S.day+"_"+exId+"_"+i];}
function cntDone(exId,tot){var n=0;for(var i=0;i<tot;i++)if(isDone(exId,i))n++;return n;}
function setW(id,v){S.weights[id]=v;sv("ll_w",S.weights);}
function setR(id,v){S.repsOv[id]=v;}
function applyProgTarget(exId,type,value){
  if(type==="reps")setR(exId,value);else setW(exId,value);
  render();
}

function finishWorkout(){
  const dd=S.prog.days[S.day];if(!dd)return;
  const slot=S.timeSlot||defaultTimeSlot();
  const rec={id:Date.now(),day:S.day,date:new Date().toISOString(),tag:dd.tag,time:slot,
    exercises:dd.exercises.map(function(ex){return{exId:ex.id,name:ex.name,weight:parseFloat(S.weights[ex.id])||0,reps:parseInt(S.repsOv[ex.id])||ex.reps,done:cntDone(ex.id,ex.sets),total:ex.sets};})};
  S.hist=[rec].concat(S.hist).slice(0,100);sv("ll_hist",S.hist);
  S.logs={};S.repsOv={};S.timeSlot=null;toast("✅ 저장 완료!");
  setTimeout(function(){S.tab="history";render();},700);
}

const TIME_LBL={morning:"🌅 아침",noon:"☀️ 점심",evening:"🌙 저녁"};
function defaultTimeSlot(){const h=new Date().getHours();return h<11?"morning":h<17?"noon":"evening";}
function setTimeSlot(t){S.timeSlot=t;render();}

const CARDIO_LBL={running:"🏃 러닝",cycling:"🚴 사이클",rowing:"🚣 로잉"};
function setCardioType(t){
  ["ct-run","ct-cyc","ct-row"].forEach(function(id){const el=document.getElementById(id);if(el)el.classList.remove("on");});
  const map={running:"ct-run",cycling:"ct-cyc",rowing:"ct-row"};
  const btn=document.getElementById(map[t]);if(btn)btn.classList.add("on");
  document.getElementById("ct").value=t;
}
function saveCardio(){
  const type=document.getElementById("ct").value;
  const slot=document.getElementById("cslot").value||defaultTimeSlot();
  const dur=parseFloat(document.getElementById("cd").value)||0;
  const dist=parseFloat(document.getElementById("ck").value)||0;
  if(!dur&&!dist)return toast("시간 또는 거리를 입력하세요");
  S.cardio=[{id:Date.now(),date:new Date().toISOString(),type:type,time:slot,duration:dur,distance:dist}].concat(S.cardio).slice(0,300);
  sv("ll_cardio",S.cardio);
  document.getElementById("cd").value="";document.getElementById("ck").value="";
  toast("🫀 유산소 저장됨!");
  const el=document.getElementById("cardio-today");
  if(el)el.innerHTML=renderTodayCardio();
}
function setCardioSlot(t){
  ["cs-m","cs-n","cs-e"].forEach(function(id){const el=document.getElementById(id);if(el)el.classList.remove("on");});
  const map={morning:"cs-m",noon:"cs-n",evening:"cs-e"};
  const btn=document.getElementById(map[t]);if(btn)btn.classList.add("on");
  document.getElementById("cslot").value=t;
}

function renderTodayCardio(){
  const today=new Date().toDateString();
  const recs=S.cardio.filter(function(c){return new Date(c.date).toDateString()===today;});
  if(!recs.length)return '<div style="font-size:10px;color:var(--muted);text-align:center;padding:8px 0">오늘 기록 없음</div>';
  return recs.map(function(c){
    return '<div class="crec"><span class="crec-type">'+(CARDIO_LBL[c.type]||c.type)+(c.time?' <span style="color:var(--dim);font-size:10px">'+(TIME_LBL[c.time]||"")+'</span>':"")+'</span><span class="crec-detail">'+(c.duration?c.duration+"분":"")+(c.duration&&c.distance?" · ":"")+(c.distance?c.distance+"km":"")+" · "+fmt(c.date)+'</span></div>';
  }).join("");
}

function readPoFields(){
  const on=document.getElementById("mpo").checked;
  if(!on)return null;
  return{on:true,type:document.getElementById("mpotype").value,start:parseFloat(document.getElementById("postart").value)||0,step:parseFloat(document.getElementById("postep").value)||0,every:parseInt(document.getElementById("poevery").value)||1};
}
function progTarget(ex){
  if(!ex.prog||!ex.prog.on)return null;
  const wk=weekOf(null);
  if(!wk||wk<1)return null;
  const cyc=Math.max(1,ex.prog.every||1);
  const val=ex.prog.start+ex.prog.step*Math.floor((wk-1)/cyc);
  return{type:ex.prog.type||"weight",value:Math.round(val*100)/100,week:wk};
}
function saveProg(){sv("ll_prog",S.prog);}

const LL_KEYS=["ll_prog","ll_hist","ll_w","ll_cardio","ll_goal"];
function exportData(){
  const dump={_app:"liftlog",_ver:APP_VERSION,_date:new Date().toISOString(),data:{}};
  LL_KEYS.forEach(function(k){const v=localStorage.getItem(k);if(v!==null)dump.data[k]=v;});
  const blob=new Blob([JSON.stringify(dump)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="liftlog_backup_"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  toast("💾 백업 파일 저장됨");
}
function importData(input){
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const dump=JSON.parse(r.result);
      if(!dump||dump._app!=="liftlog"||!dump.data)throw new Error("형식 오류");
      if(!confirm("현재 기기의 데이터를 백업 파일로 덮어씁니다. 진행할까요?"))return;
      LL_KEYS.forEach(function(k){
        if(dump.data[k]!==undefined)localStorage.setItem(k,dump.data[k]);
      });
      toast("✅ 복원 완료");
      setTimeout(function(){location.reload();},700);
    }catch(e){toast("❌ 잘못된 백업 파일");}
  };
  r.readAsText(f);
  input.value="";
}

async function callAI(){
  const key=(S.apiKey||"").trim();

  if(!key)return toast("⚠️ API 키를 입력하세요");
  if(!prompt)return toast("목표/상태를 입력하세요");
  S.aiLoad=true;S.aiResp="";renderM();
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,messages:[{role:"user",content:"당신은 전문 퍼스널 트레이너입니다. 아래 사용자에게 맞는 주 4일 운동 프로그램을 추천하세요.\n사용자: "+prompt+"\n\n다음 JSON만 반환 (코드블록/설명 없이):\n{\"name\":\"프로그램명\",\"weeks\":10,\"days\":{\"월\":{\"label\":\"월·저녁\",\"tag\":\"UPPER PUSH\",\"color\":\"#FF6B35\",\"exercises\":[{\"id\":\"bench\",\"name\":\"운동명\",\"sets\":4,\"reps\":5,\"rest\":120}]},\"화\":{\"label\":\"화·저녁\",\"tag\":\"LOWER QUAD\",\"color\":\"#4ECDC4\",\"exercises\":[{\"id\":\"hack\",\"name\":\"운동명\",\"sets\":4,\"reps\":6,\"rest\":120}]},\"수\":{\"label\":\"수·점심\",\"tag\":\"UPPER PULL\",\"color\":\"#A78BFA\",\"exercises\":[{\"id\":\"row\",\"name\":\"운동명\",\"sets\":4,\"reps\":5,\"rest\":120}]},\"목\":{\"label\":\"목·점심\",\"tag\":\"LOWER HINGE\",\"color\":\"#F59E0B\",\"exercises\":[{\"id\":\"rdl\",\"name\":\"운동명\",\"sets\":4,\"reps\":5,\"rest\":120}]}}}"}]})
    });
    const data=await res.json();
    if(!res.ok)throw new Error(data.error&&data.error.message||"API 오류");

function applyAIProg(){
  try{
    const p=JSON.parse(S.aiResp.replace(/```json|```/g,"").trim());
    if(!p.days)throw new Error();
    Object.values(p.days).forEach(function(d){d.exercises.forEach(function(ex){if(!ex.video)ex.video=getExVideo(ex.name);});});
    p.id="ai"+Date.now();S.prog=p;saveProg();
    S.goal.startDate=new Date().toISOString().slice(0,10);S.goal.weeks=p.weeks||10;sv("ll_goal",S.goal);

function weekOf(dateStr){
  if(!S.goal.startDate)return null;
  return Math.floor((new Date(dateStr||Date.now())-new Date(S.goal.startDate))/(1000*60*60*24*7))+1;
}
function buildWeekData(){
  const wks=S.prog.weeks||10;
  const data=[];for(var i=0;i<wks;i++)data.push({w:i+1,sess:0,target:Object.keys(S.prog.days).length});
  S.hist.forEach(function(r){const w=weekOf(r.date);if(w>=1&&w<=wks)data[w-1].sess++;});
  return data;
}

function mkChart(data,color,yLabel){
  if(!data||data.length<2)return '<div class="nodata">데이터 2개 이상 필요</div>';
  const W=320,H=130,PL=40,PR=8,PT=8,PB=28,cW=W-PL-PR,cH=H-PT-PB;
  const ys=data.map(function(d){return d.y;});
  const mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys),rng=mx-mn||1;
  const px=function(i){return PL+(i/(data.length-1))*cW;};
  const py=function(v){return PT+cH-((v-mn)/rng)*cH;};
  const pts=data.map(function(d,i){return px(i)+","+py(d.y);}).join(" ");
  const area=px(0)+","+(PT+cH)+" "+pts+" "+px(data.length-1)+","+(PT+cH);
  const pri=ys.indexOf(mx);
  const uid=color.replace(/[^a-z0-9]/gi,"");
  return '<svg width="100%" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'
    +'<defs><linearGradient id="g'+uid+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="'+color+'" stop-opacity=".3"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/>'
    +'</linearGradient></defs>'
    +'<polygon points="'+area+'" fill="url(#g'+uid+')" />'
    +'<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    +data.map(function(d,i){return '<circle cx="'+px(i)+'" cy="'+py(d.y)+'" r="'+(i===pri?4:2.5)+'" fill="'+(i===pri?color:"#fff")+'" stroke="'+color+'" stroke-width="'+(i===pri?2:1)+'"/>';}).join("")
    +'<text x="'+(PL-3)+'" y="'+(py(mx)+4)+'" fill="#555" font-size="9" text-anchor="end">'+mx+'</text>'
    +'<text x="'+(PL-3)+'" y="'+(py(mn)+4)+'" fill="#555" font-size="9" text-anchor="end">'+mn+'</text>'
    +'<text x="'+PL+'" y="'+(H-4)+'" fill="#555" font-size="9" text-anchor="middle">'+data[0].label+'</text>'
    +'<text x="'+(W-PR)+'" y="'+(H-4)+'" fill="#555" font-size="9" text-anchor="end">'+data[data.length-1].label+'</text>'
    +'</svg>';
}

  const navItems=[["today","🏋️","오늘"],["history","📋","기록"],["trends","📈","트렌드"],["program","⚙️","프로그램"],["goals","🎯","목표"]];
  document.getElementById("app").innerHTML=
    '<div class="hdr">'
      +'<div><div class="logo">LIFT LOG</div><div class="logo-sub">근력 루틴 트래커</div></div>'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<button id="installBtn" class="installbtn hidden" onclick="doInstallPWA()">📲 앱 설치</button>'
      +'<div class="tpill '+(S.tsec<=0?"off":"")+'" id="tp"><span style="font-size:12px">⏱</span><span class="tn" id="tn">'+S.tsec+'s</span></div>'
      +'</div>'
    +'</div>'
    +'<div class="pg">'+(S.tab==="today"?pgToday(days,tk):S.tab==="history"?pgHistory():S.tab==="trends"?pgTrends():S.tab==="program"?pgProgram():pgGoals())+'</div>'
    +'<nav class="nav">'+navItems.map(function(t){return '<button class="nb '+(S.tab===t[0]?"on":"")+'" onclick="setTab(\''+t[0]+'\')"><span class="ic">'+t[1]+'</span>'+t[2]+'</button>';}).join("")+'</nav>';
}

function pgToday(days,tk){
  if(!S.prog.days[S.day])S.day=days[0];
  const dd=S.prog.days[S.day],color=dd.color;
  var tot=0,dn=0;dd.exercises.forEach(function(ex){tot+=ex.sets;dn+=cntDone(ex.id,ex.sets);});
  const pct=tot?dn/tot*100:0;
  var html='<div class="day-row">';
  days.forEach(function(d){
    const on=S.day===d;
    html+='<button class="db '+(on?"on":"")+'" style="'+(on?"background:"+S.prog.days[d].color+";border-color:"+S.prog.days[d].color:"")+'" onclick="setDay(\''+d+'\')">'+d+(d===tk?'<span class="tdot"></span>':"")+'</button>';
  });
  html+='</div>';
  html+='<div class="dhdr" style="border-color:'+color+'"><div class="dtitle" style="color:'+color+'">'+esc(dd.label)+'</div><div class="dtag">'+dd.tag+'</div></div>';
  html+='<div class="pb"><div class="pbr" style="width:'+pct+'%;background:'+color+'"></div></div>';
  dd.exercises.forEach(function(ex){
    const done=cntDone(ex.id,ex.sets),all=done===ex.sets;
    html+='<div class="card '+(all?"faded":"")+'">';
    html+='<div class="ctop"><div><div class="exn">'+esc(ex.name)+(ex.knee?'<span class="ktag">🦵무릎주의</span>':'')+'</div><div class="exm">'+ex.sets+'세트 × '+ex.reps+'회 · 휴식 '+ex.rest+'s</div></div>';
    html+='<div class="dct"><span style="color:'+color+'">'+done+'</span><span style="color:var(--muted)">'+'/'+ex.sets+'</span></div></div>';
    html+='<div class="ir">';
    html+='<span class="il">무게</span><input class="ii" type="number" inputmode="decimal" placeholder="0" value="'+(S.weights[ex.id]||"")+'" oninput="setW(\''+ex.id+'\',this.value)"/><span class="iu">kg</span>';
    html+='<span class="il" style="margin-left:4px">횟수</span><input class="ii" type="number" inputmode="numeric" placeholder="'+ex.reps+'" value="'+(S.repsOv[ex.id]||"")+'" oninput="setR(\''+ex.id+'\',this.value)"/><span class="iu">회</span>';
    const pt=progTarget(ex);
    if(pt)html+='<span class="ptarget">🎯 W'+pt.week+' 목표 '+pt.value+(pt.type==="reps"?"회":"kg")+'<button class="papply" onclick="applyProgTarget(\''+ex.id+'\',\''+pt.type+'\','+pt.value+')">적용</button></span>';
    if(ex.video)html+='<a class="vbtn" href="'+esc(ex.video)+'" target="_blank">▶ 영상</a>';
    html+='</div>';
    html+='<div class="sr">';
    for(var i=0;i<ex.sets;i++){
      const on=isDone(ex.id,i);
      html+='<button class="sb '+(on?"on":"")+'" style="'+(on?"background:"+color+";border-color:"+color:"")+'" onclick="toggleSet(\''+ex.id+'\','+i+')">'+(i+1)+'</button>';
    }
    html+='</div>';
    html+='<button class="rbtn" onclick="startTimer('+ex.rest+')">⏱ 휴식 '+ex.rest+'초</button>';
    html+='</div>';
  });
  const curSlot=S.timeSlot||defaultTimeSlot();
  html+='<div class="ctoggle" style="margin-top:8px">';
  [["morning","🌅 아침"],["noon","☀️ 점심"],["evening","🌙 저녁"]].forEach(function(t){
    const on=curSlot===t[0];
    html+='<button class="ctbtn '+(on?"on":"")+'" style="'+(on?"background:linear-gradient(135deg,"+color+",#FFB454);border-color:transparent;color:#1a0d04;font-weight:700":"")+'" onclick="setTimeSlot(\''+t[0]+'\')">'+t[1]+'</button>';
  });
  html+='</div>';
  html+='<button class="fbtn" onclick="finishWorkout()">💪 완료 · 저장</button>';
  html+='<div class="cardio-card">';
  html+='<div class="cardio-title">🫀 유산소 기록</div>';
  html+='<div class="ctoggle"><button class="ctbtn on" id="ct-run" onclick="setCardioType(\'running\')">🏃 러닝</button>';
  html+='<button class="ctbtn" id="ct-cyc" onclick="setCardioType(\'cycling\')">🚴 사이클</button>';
  html+='<button class="ctbtn" id="ct-row" onclick="setCardioType(\'rowing\')">🚣 로잉</button></div>';
  html+='<input type="hidden" id="ct" value="running"/>';
  const cslot=defaultTimeSlot();
  html+='<div class="ctoggle">';
  [["morning","🌅 아침"],["noon","☀️ 점심"],["evening","🌙 저녁"]].forEach(function(t){
    const on=cslot===t[0];
    html+='<button class="ctbtn '+(on?"on":"")+'" id="cs-'+t[0].charAt(0)+'" onclick="setCardioSlot(\''+t[0]+'\')">'+t[1]+'</button>';
  });
  html+='</div>';
  html+='<input type="hidden" id="cslot" value="'+cslot+'"/>';
  html+='<div class="cinp-row"><div class="cinp-grp"><div class="cinp-lbl">시간(분)</div><input class="cinp" type="number" inputmode="decimal" id="cd" placeholder="0"/></div>';
  html+='<div class="cinp-grp"><div class="cinp-lbl">거리(km)</div><input class="cinp" type="number" inputmode="decimal" id="ck" placeholder="0.0"/></div>';
  html+='<button class="csave" onclick="saveCardio()">저장</button></div>';
  html+='<div id="cardio-today">'+renderTodayCardio()+'</div>';
  html+='</div>';
  return html;
}

function pgHistory(){
  if(!S.hist.length&&!S.cardio.length)return '<div class="empty">기록이 없어요<br>첫 운동을 완료해보세요 💪</div>';
  var html="";
  S.hist.forEach(function(rec){
    const c=S.prog.days[rec.day]&&S.prog.days[rec.day].color||"#888";
    html+='<div class="hcard"><div class="hhdr"><div style="display:flex;align-items:center;gap:7px"><span class="hdbadge" style="background:'+c+'">'+rec.day+'</span><span style="font-size:9px;color:var(--muted)">'+(rec.tag||"")+'</span>'+(rec.time?'<span style="font-size:9px;color:var(--dim)">'+(TIME_LBL[rec.time]||"")+'</span>':"")+'</div><span class="hdate">'+fmt(rec.date)+'</span></div>';
    rec.exercises.forEach(function(ex){html+='<div class="hex"><span class="hexn">'+esc(ex.name)+'</span><span class="hexd">'+(ex.weight?ex.weight+"kg · ":"")+ex.done+"/"+ex.total+"세트 × "+(ex.reps||"-")+'회</span></div>';});
    html+='</div>';
  });
  if(S.cardio.length){
    html+='<hr class="sep"/><div style="font-size:9px;color:var(--teal);letter-spacing:2px;margin-bottom:10px">🫀 유산소 기록</div>';
    S.cardio.slice(0,30).forEach(function(c){
      html+='<div class="hcard"><div class="hhdr"><div style="display:flex;align-items:center;gap:7px"><span style="color:var(--teal);font-size:12px;font-weight:700">'+(CARDIO_LBL[c.type]||c.type)+'</span>'+(c.time?'<span style="font-size:9px;color:var(--dim)">'+(TIME_LBL[c.time]||"")+'</span>':"")+'</div><span class="hdate">'+fmt(c.date)+'</span></div>';
      html+='<div class="hex"><span class="hexn">'+(c.duration?c.duration+"분":"")+(c.duration&&c.distance?" · ":"")+(c.distance?c.distance+"km":"")+'</span></div></div>';
    });
  }
  return html;
}

function pgTrends(){
  return '<div class="ttoggle">'
    +'<button class="ttbtn '+(S.tView==="strength"?"on":"")+'" onclick="S.tView=\'strength\';render()">💪 근력</button>'
    +'<button class="ttbtn '+(S.tView==="cardio"?"on":"")+'" onclick="S.tView=\'cardio\';render()">🫀 유산소</button>'
    +'</div>'
    +(S.tView==="strength"?pgTrendStrength():pgTrendCardio());
}

function pgTrendStrength(){
  const days=Object.keys(S.prog.days);
  if(days.indexOf(S.tDay)<0)S.tDay=days[0];
  const dd=S.prog.days[S.tDay],exs=dd.exercises,color=dd.color;
  if(!S.tEx||!exs.find(function(e){return e.id===S.tEx;}))S.tEx=exs[0]&&exs[0].id||null;
  const curEx=exs.find(function(e){return e.id===S.tEx;});
  const wdata=S.hist.filter(function(r){return r.day===S.tDay&&r.exercises&&r.exercises.some(function(e){return e.exId===S.tEx||e.name===(curEx&&curEx.name);});}).slice().reverse().map(function(r){
    const e=r.exercises.find(function(e){return e.exId===S.tEx||e.name===(curEx&&curEx.name);});
    if(!e||!e.weight)return null;const d=new Date(r.date);return{y:e.weight,label:(d.getMonth()+1)+"/"+(d.getDate())};
  }).filter(Boolean);
  const pr=wdata.length?Math.max.apply(null,wdata.map(function(d){return d.y;})):0;
  var html='<div class="tsel"><select onchange="S.tDay=this.value;S.tEx=null;render()">';
  days.forEach(function(d){html+='<option value="'+d+'" '+(S.tDay===d?"selected":"")+'>'+d+' · '+S.prog.days[d].tag+'</option>';});
  html+='</select><select onchange="S.tEx=this.value;render()">';
  exs.forEach(function(ex){html+='<option value="'+ex.id+'" '+(S.tEx===ex.id?"selected":"")+'>'+esc(ex.name)+'</option>';});
  html+='</select></div>';
  html+='<div class="cbox"><div class="ctitle">📊 '+esc(curEx&&curEx.name||"")+" · 무게 추이</div>"+mkChart(wdata,color,"kg")+(pr>0?'<div class="prbadge">🏆 PR : '+pr+'kg</div>':"")+'</div>';
  exs.forEach(function(ex){
    const vdata=S.hist.filter(function(r){return r.day===S.tDay&&r.exercises&&r.exercises.some(function(e){return e.exId===ex.id||e.name===ex.name;});}).slice().reverse().map(function(r){
      const e=r.exercises.find(function(e){return e.exId===ex.id||e.name===ex.name;});
      if(!e||!e.weight)return null;const d=new Date(r.date);return{y:Math.round(e.weight*e.done*(e.reps||ex.reps)),label:(d.getMonth()+1)+"/"+(d.getDate())};
    }).filter(Boolean);
    if(vdata.length>=2)html+='<div class="cbox"><div class="ctitle">📦 '+esc(ex.name)+' · 볼륨</div>'+mkChart(vdata,color)+'</div>';
  });
  return html;
}

function pgTrendCardio(){
  if(!S.cardio.length)return '<div class="empty">유산소 기록이 없어요<br>오늘 탭에서 기록하세요 🫀</div>';
  const last=S.cardio.slice(0,30).slice().reverse();
  const totalDist=S.cardio.reduce(function(a,c){return a+c.distance;},0).toFixed(1);
  const totalDur=S.cardio.reduce(function(a,c){return a+c.duration;},0);
  const runs=S.cardio.filter(function(c){return c.type==="running";}).length;
  const cycs=S.cardio.filter(function(c){return c.type==="cycling";}).length;
  const rows=S.cardio.filter(function(c){return c.type==="rowing";}).length;
  const runData=last.filter(function(c){return c.type==="running"&&c.distance>0;}).map(function(c){const d=new Date(c.date);return{y:c.distance,label:(d.getMonth()+1)+"/"+(d.getDate())};});
  const cycData=last.filter(function(c){return c.type==="cycling"&&c.distance>0;}).map(function(c){const d=new Date(c.date);return{y:c.distance,label:(d.getMonth()+1)+"/"+(d.getDate())};});
  const rowData=last.filter(function(c){return c.type==="rowing"&&c.distance>0;}).map(function(c){const d=new Date(c.date);return{y:c.distance,label:(d.getMonth()+1)+"/"+(d.getDate())};});
  const durData=last.filter(function(c){return c.duration>0;}).map(function(c){const d=new Date(c.date);return{y:c.duration,label:(d.getMonth()+1)+"/"+(d.getDate())};});
  var html='<div class="cardio-stat-grid">'
    +'<div class="cstat"><div class="cstat-n">'+totalDist+'</div><div class="cstat-l">총 거리km</div></div>'
    +'<div class="cstat"><div class="cstat-n">'+totalDur+'</div><div class="cstat-l">총 분</div></div>'
    +'<div class="cstat"><div class="cstat-n">'+S.cardio.length+'</div><div class="cstat-l">총 세션</div></div>'
    +'</div>';
  if(runData.length>=2)html+='<div class="cbox"><div class="ctitle">🏃 러닝 · 거리</div>'+mkChart(runData,"#4ECDC4","km")+'</div>';
  if(cycData.length>=2)html+='<div class="cbox"><div class="ctitle">🚴 사이클 · 거리</div>'+mkChart(cycData,"#A78BFA","km")+'</div>';
  if(rowData.length>=2)html+='<div class="cbox"><div class="ctitle">🚣 로잉 · 거리</div>'+mkChart(rowData,"#F59E0B","km")+'</div>';
  if(durData.length>=2)html+='<div class="cbox"><div class="ctitle">⏱ 시간 추이</div>'+mkChart(durData,"#FB7185","분")+'</div>';
  html+='<div class="cbox"><div class="ctitle">🏃 러닝 '+runs+'회 &nbsp;·&nbsp; 🚴 사이클 '+cycs+'회 &nbsp;·&nbsp; 🚣 로잉 '+rows+'회</div>'
    +'<div style="display:flex;gap:8px;margin-top:8px">'
    +'<div style="flex:'+(runs||1)+';background:var(--teal);border-radius:4px;height:8px;opacity:.8"></div>'
    +'<div style="flex:'+(cycs||1)+';background:var(--violet);border-radius:4px;height:8px;opacity:.8"></div>'
    +'<div style="flex:'+(rows||1)+';background:var(--orange);border-radius:4px;height:8px;opacity:.8"></div>'
    +'</div><div style="display:flex;gap:8px;margin-top:4px;font-size:9px;color:var(--muted)"><span style="color:var(--teal)">■</span> 러닝 &nbsp;<span style="color:var(--violet)">■</span> 사이클 &nbsp;<span style="color:var(--orange)">■</span> 로잉</div></div>';
  return html;
}

function moveEx(day,idx,dir){
  const arr=S.prog.days[day].exercises;
  const ni=idx+dir;
  if(ni<0||ni>=arr.length)return;
  const tmp=arr[idx];arr[idx]=arr[ni];arr[ni]=tmp;
  saveProg();render();
}
function openCopyDay(day){openM("copy-day",{day:day});}
function doCopyDay(targetDay){
  const src=S.mdata.day;
  if(!confirm("'"+src+"' 요일의 운동 구성을 '"+targetDay+"' 요일에 복사할까요? 기존 '"+targetDay+"' 운동 구성은 덮어씁니다."))return;
  const cloned=JSON.parse(JSON.stringify(S.prog.days[src].exercises)).map(function(ex){ex.id="ex"+Date.now()+Math.floor(Math.random()*1000);return ex;});
  S.prog.days[targetDay].exercises=cloned;
  saveProg();closeM();render();toast("복사 완료");
}
function openBulkEdit(day){openM("bulk-edit",{day:day});}
function doBulkEdit(){
  const day=S.mdata.day;
  const arr=S.prog.days[day].exercises;
  const setsV=document.getElementById("bsets").value.trim();
  const repsV=document.getElementById("breps").value.trim();
  const restV=document.getElementById("brest").value.trim();
  var changed=0;
  arr.forEach(function(ex,i){
    const cb=document.getElementById("bchk"+i);
    if(!cb||!cb.checked)return;
    if(setsV)ex.sets=parseInt(setsV)||ex.sets;
    if(repsV)ex.reps=parseInt(repsV)||ex.reps;
    if(restV)ex.rest=parseInt(restV)||ex.rest;
    changed++;
  });
  if(!changed)return toast("적용할 운동을 선택하세요");
  saveProg();closeM();render();toast(changed+"개 운동 수정됨");
}
function pgProgram(){
  const days=Object.keys(S.prog.days);
  const rec=recWeeks(S.prog);
  var html='<div class="phdr"><div><div class="pname">'+esc(S.prog.name)+'</div><div class="pwks">'+S.prog.weeks+'주 프로그램</div><div class="recwks">📌 '+rec.note+'</div></div>'
    +'<button class="ibtn" onclick="openM(\'edit-prog\')">✏️ 편집</button></div>'
    +'<button class="airbtn" onclick="openM(\'ai-rec\')">✨ AI 프로그램 추천 받기</button>';
  html+='<button class="tplbtn" onclick="openM(\'tpl-list\')">📚 기본 프로그램 선택 (10종)</button>';
  days.forEach(function(d){
    const dd=S.prog.days[d];
    const cat=DAY_CAT[d]||"하체";
    html+='<div class="pdblock"><div class="pdtitle" style="color:'+dd.color+'">'+esc(dd.label)+' · '+dd.tag+'</div>';
    html+='<div class="dba-row"><button class="dba-btn" onclick="openCopyDay(\''+d+'\')">📋 다른 요일에 복사</button><button class="dba-btn" onclick="openBulkEdit(\''+d+'\')">🛠 일괄 수정</button></div>';
    dd.exercises.forEach(function(ex,i){
      html+='<div class="pexrow">'
        +'<div class="ordbtns"><button class="ordbtn" '+(i===0?"disabled":"")+' onclick="moveEx(\''+d+'\','+i+',-1)">▲</button><button class="ordbtn" '+(i===dd.exercises.length-1?"disabled":"")+' onclick="moveEx(\''+d+'\','+i+',1)">▼</button></div>'
        +'<div class="pexinfo"><div class="pexnm">'+esc(ex.name)+(ex.knee?'<span class="ktag">🦵</span>':'')+(ex.prog&&ex.prog.on?'<span class="ktag" style="background:rgba(60,232,214,.14);color:var(--teal)">📈증가</span>':'')+'</div>'
        +'<div class="pexmeta">'+ex.sets+'세트 × '+ex.reps+'회 · '+ex.rest+'s'+(ex.video?' · <a href="'+esc(ex.video)+'" target="_blank" style="color:var(--muted)">▶영상</a>':'')+'</div></div>'
        +'<button class="ibtn" onclick="S.mExCat=\''+cat+'\';openM(\'edit-ex\',{day:\''+d+'\',idx:'+i+'})">편집</button></div>';
    });
    html+='<button class="addbtn" onclick="S.mExCat=\''+cat+'\';openM(\'add-ex\',{day:\''+d+'\'})">+ 운동 추가</button></div>';
  });
  return html;
}

function pgGoals(){
  const wks=S.prog.weeks||10,has=!!S.goal.startDate;
  const cw=has?weekOf(null):null,wd=has?buildWeekData():null;
  const pct=has&&cw?Math.min(100,Math.round(((cw-1)/wks)*100)):0;
  const compWks=wd?wd.filter(function(w){return w.w<(cw||0)&&w.sess>=w.target;}).length:0;
  const rec=recWeeks(S.prog);
  var html='<div class="gcard"><div class="gtitle">프로그램 설정</div>'
    +'<div style="font-size:10px;color:var(--teal);margin-bottom:10px">📌 '+rec.note+'</div>'
    +'<div class="ginprow"><span class="ginplabel">시작일</span><input class="ginp" type="date" value="'+(S.goal.startDate||"")+'" onchange="S.goal.startDate=this.value;sv(\'ll_goal\',S.goal);render()"/></div>'
    +'<div class="ginprow"><span class="ginplabel">총 기간</span><input class="ginp" type="number" value="'+wks+'" min="1" max="52" onchange="S.goal.weeks=parseInt(this.value)||10;S.prog.weeks=S.goal.weeks;saveProg();sv(\'ll_goal\',S.goal);render()"/><span style="font-size:11px;color:var(--muted)">주</span></div>'
    +'</div>';
  if(has){
    html+='<div class="g2grid">'
      +'<div class="gcard" style="padding:13px"><div class="gtitle">현재 주차</div><div class="gbig" style="color:var(--orange)">'+Math.max(1,Math.min(cw||1,wks))+'<span style="font-size:16px;color:var(--muted)">'+"/"+wks+'</span></div><div class="gsub">진행률 '+pct+'%</div><div class="pb" style="margin-top:8px;margin-bottom:0"><div class="pbr" style="width:'+pct+'%;background:var(--orange)"></div></div></div>'
      +'<div class="gcard" style="padding:13px"><div class="gtitle">총 세션</div><div class="gbig" style="color:var(--green)">'+S.hist.length+'</div><div class="gsub">완료 주 '+compWks+"/"+wks+'</div></div>'
      +'</div>'
      +'<div class="gcard"><div class="gtitle">주차별 달성 현황</div><div class="wgrid">';
    wd.forEach(function(w){
      const st=w.w<(cw||0)?"done":w.w===(cw||0)?"cur":"fut";
      const pp=w.target?Math.round(w.sess/w.target*100):0;
      const clr=st==="done"?"var(--green)":st==="cur"?"var(--orange)":"var(--muted)";
      html+='<div class="wcell '+st+'"><div class="wn">W'+w.w+'</div><div class="wd" style="color:'+clr+'">'+w.sess+"/"+w.target+'</div><div style="font-size:9px;color:'+clr+'">'+(st==="done"?"✓":st==="cur"?pp+"%":"·")+'</div></div>';
    });
    html+='</div></div>';
  }else{
    html+='<div class="empty">시작일을 설정하면<br>주차별 달성 현황을 볼 수 있어요 📅</div>';
  }
  html+='<div class="gcard"><div class="gtitle">데이터 백업 / 복원</div>'
    +'<div style="font-size:10px;color:var(--muted);margin-bottom:10px;line-height:1.5">운동 기록은 이 기기에만 저장됩니다. 주소 변경·앱 재설치·기기 변경 전에 백업하세요.</div>'
    +'<div style="display:flex;gap:8px">'
    +'<button class="fbtn" style="flex:1;margin:0" onclick="exportData()">💾 백업 내보내기</button>'
    +'<button class="fbtn" style="flex:1;margin:0;background:linear-gradient(135deg,#4ECDC4,#2BB3A3)" onclick="document.getElementById(\'llimp\').click()">📂 복원하기</button>'
    +'</div>'
    +'<input type="file" id="llimp" accept="application/json,.json" style="display:none" onchange="importData(this)"/>'
    +'</div>';
  return html;
}

let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault();deferredInstallPrompt=e;
  const b=document.getElementById("installBtn");if(b)b.classList.remove("hidden");
});
window.addEventListener("appinstalled",function(){
  deferredInstallPrompt=null;
  const b=document.getElementById("installBtn");if(b)b.classList.add("hidden");
  toast("✅ 앱이 설치되었습니다");
});
function doInstallPWA(){
  if(!deferredInstallPrompt)return;

  deferredInstallPrompt.userChoice.then(function(){
    deferredInstallPrompt=null;
    const b=document.getElementById("installBtn");if(b)b.classList.add("hidden");
  });
}
